<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Shubham Prasad Kuiri profile header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#clip)" opacity=".8">
    <circle cx="100" cy="70" r="70" fill="#58a6ff" opacity=".10" filter="url(#glow)">
      <animate attributeName="cx" values="100;170;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="230" r="90" fill="#a371f7" opacity=".10" filter="url(#glow)">
      <animate attributeName="cx" values="1090;1030;1090" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;170;230" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="55" r="4" fill="#58a6ff"><animate attributeName="cy" values="55;35;55" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="235" r="3" fill="#a371f7"><animate attributeName="cy" values="235;215;235" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="55" r="3" fill="#58a6ff"><animate attributeName="cy" values="55;75;55" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="112" fill="#f0f6fc" font-size="42" font-weight="700">Shubham Prasad Kuiri</text>
    <text x="600" y="155" fill="#8b949e" font-size="20">Data Analytics  •  Machine Learning  •  Data Science</text>
    <rect x="430" y="184" width="340" height="3" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="260;340;260" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="470;430;470" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="224" fill="#58a6ff" font-size="16" font-weight="600">Currently learning Machine Learning</text>
    <text x="600" y="253" fill="#8b949e" font-size="14">Python  ·  SQL  ·  Statistics  ·  EDA  ·  Power BI</text>
  </g>
</svg>
